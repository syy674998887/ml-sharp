<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Starting ML-SHARP</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: transparent;
        --panel: #171d2b;
        --text: #f3f6fb;
        --muted: #9ba7b7;
        --accent: #2dd4bf;
        --accent-2: #60a5fa;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--text);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial,
          sans-serif;
      }

      main {
        width: min(440px, calc(100vw - 48px));
        padding: 34px 32px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 8px;
        background: var(--panel);
        box-shadow: none;
      }

      h1 {
        margin: 0 0 10px;
        font-size: 25px;
        line-height: 1.2;
        letter-spacing: 0;
      }

      p {
        margin: 0;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.55;
      }

      .progress {
        position: relative;
        height: 4px;
        margin-top: 28px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.09);
      }

      .progress::after {
        content: "";
        position: absolute;
        inset: 0 auto 0 0;
        width: 42%;
        border-radius: inherit;
        background: linear-gradient(90deg, var(--accent), var(--accent-2));
        animation: slide 1.25s ease-in-out infinite;
      }

      @keyframes slide {
        0% {
          transform: translateX(-110%);
        }
        55% {
          transform: translateX(85%);
        }
        100% {
          transform: translateX(260%);
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Starting SHARP engine</h1>
      <p>
        The desktop app is preparing the local Python backend. The first launch can
        take longer while dependencies and the model cache are checked.
      </p>
      <div class="progress" aria-label="Starting"></div>
    </main>
  </body>
</html>
